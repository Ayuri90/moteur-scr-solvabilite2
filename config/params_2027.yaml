# (adopté le 29/10/2025, publié au JO le 18/02/2026, applicable au 30/01/2027)
#
# [VERIFIE]   changement confirmé par une source publique
# [AVERIFIER] valeur numérique à confronter au texte avant toute utilisation
# =============================================================================

extrapolation:
  # Le dernier point liquide (LLP) est remplacé par un premier point de lissage (FSP),
  # au-delà duquel les forwards convergent vers l'UFR à la vitesse a. [VERIFIE]
  premier_point_lissage: 20
  vitesse_convergence: 0.10        # [AVERIFIER]
  poids_llfr: {20: 1.0, 25: 0.5, 30: 0.5, 40: 0.25, 50: 0.25}   # [AVERIFIER]

taux:
  # Choc = multiplicatif + décalage parallèle ; plancher de +1 point supprimé à la hausse ;
  # planchers négatifs dépendant du terme à la baisse ; UFR stressé de +/- 15 pb. [VERIFIE]
  # Les tables ci-dessous sont [AVERIFIER] : utiliser de préférence les courbes choquées EIOPA.
  b_hausse: {1: 0.61, 2: 0.53, 5: 0.44, 10: 0.36, 15: 0.32, 20: 0.28, 30: 0.24, 50: 0.20}
  a_hausse: {1: 0.0214, 2: 0.0186, 5: 0.0161, 10: 0.0135, 15: 0.0115, 20: 0.0102, 30: 0.0087, 50: 0.0069}
  b_baisse: {1: 0.58, 2: 0.51, 5: 0.44, 10: 0.37, 15: 0.33, 20: 0.30, 30: 0.26, 50: 0.22}
  a_baisse: {1: 0.0116, 2: 0.0099, 5: 0.0086, 10: 0.0075, 15: 0.0068, 20: 0.0063, 30: 0.0054, 50: 0.0046}
  planchers_baisse: {1: -0.0125, 7: -0.0125, 20: -0.00893, 90: -0.00893}   # [VERIFIE (ordres de grandeur)]
  decalage_ufr_hausse: 0.0015
  decalage_ufr_baisse: -0.0015

correlations:
  taux_spread_baisse: 0.25         # au lieu de 0,50 [VERIFIE]
  a_baisse: 0.50                   # inchangé pour action et immobilier
  b_hausse: 0.0                    # taux / spread nul lorsque le scénario haussier s'applique

action:
  corridor_ajustement_symetrique: 0.13    # élargi de +/- 10 % à +/- 13 % [VERIFIE]

non_vie:
  facteur_np: 0.80                 # ajustement réassurance non proportionnelle, segments 1, 4 et 5 [VERIFIE]
  couverture_np:                   # [CHOIX] couverture non proportionnelle effectivement souscrite
    auto_rc: true
    auto_dommages: false
    incendie_mrh: false
    rc_generale: false

marge_risque:
  cout_du_capital_actuel: 0.06
  cout_du_capital_2027: 0.0475     # [VERIFIE]
  lambda: 0.90                     # facteur de dégressivité temporelle [AVERIFIER]
  plancher_lambda: 0.50            # [AVERIFIER]
